[package]
name = "work-kb"
version = "0.1.0"
edition = "2021"

[lib]
name = "work_kb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.7"
regex = "1"
tauri-plugin-dialog = "2"
jieba-rs = "0.7"
pinyin = "0.10"
open = "5"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
